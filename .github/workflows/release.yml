name: Release

# Builds a signed release APK and publishes it as a proper GitHub release. Started by hand:
# Actions > Release > "Run workflow", enter the version (for example 0.2.0). The workflow
#  - refuses a version that already has a tag,
#  - runs the engine tests,
#  - builds app:assembleRelease (R8) signed with the release key from the secrets,
#  - publishes the release "v<version>" with the APK attached twice: once as
#    triplea-mobile-<version>.apk and once as triplea-mobile.apk, so the README's link
#    .../releases/latest/download/triplea-mobile.apk always points at the newest release.
#
# Secrets (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_B64     the keystore, base64 encoded (base64 -w0 release.keystore)
#   RELEASE_STORE_PASSWORD   its password
#   RELEASE_KEY_ALIAS        the key alias
#   RELEASE_KEY_PASSWORD     the key password
# Create the keystore once and keep it: Android only updates an app when the new APK is signed
# with the same key, so a lost keystore means everybody has to uninstall and reinstall.
#   keytool -genkeypair -v -keystore release.keystore -alias triplea-mobile -keyalg RSA \
#     -keysize 4096 -validity 10000 -dname "CN=TripleA Mobile"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (becomes tag v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          V="${VERSION#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null || git ls-remote --exit-code --tags origin "v$V" >/dev/null 2>&1; then
            echo "::error::tag v$V already exists; pick a new version"; exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$V"
          # 1.2.3 -> 10203: grows with every version, which Android requires for updates
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $V (versionCode $CODE)"

      - name: Release key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for NAME in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!NAME}" ]; then echo "::error::secret $NAME is not set (see the header of this workflow)"; exit 1; fi
          done
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Engine tests
        run: |
          chmod +x gradlew
          ./gradlew :engine:test --no-daemon

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PAPP_VERSION=${{ steps.version.outputs.version }} \
            -PAPP_VERSION_CODE=${{ steps.version.outputs.code }}

      - name: Verify the signature and name the file
        id: name
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::no signed APK was produced (found: $(ls app/build/outputs/apk/release))"; exit 1
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          FP=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 "SHA-256" | sed 's/.*: //')
          FILE="triplea-mobile-${{ steps.version.outputs.version }}.apk"
          cp "$APK" "$FILE"
          cp "$APK" triplea-mobile.apk
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"
          rm -f release.keystore

      - name: Publish release v${{ steps.version.outputs.version }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: TripleA Mobile ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          body: |
            Signed release build (versionCode ${{ steps.version.outputs.code }}).
            Signing key (SHA-256): `${{ steps.name.outputs.fingerprint }}`

            Installs over every earlier release. It does not install over a dev build (different key):
            uninstall the dev build first.
          files: |
            ${{ steps.name.outputs.file }}
            triplea-mobile.apk
