[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation-compose = "2.10.1"
core-ktx = "1.19.0"
desugar = "2.1.5"
guava = "33.7.1-android"
gson = "2.14.0"
lombok = "1.18.48"
jsr305 = "3.0.2"
jetbrains-annotations = "26.0.2"
slf4j = "2.0.17"
snakeyaml-engine = "3.1.1"
